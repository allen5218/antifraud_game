server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  # text/html 由 nginx 自動壓縮。
  gzip_types application/javascript text/javascript text/css application/json image/svg+xml application/manifest+json;

  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~ "^/assets/.*-[A-Za-z0-9_-]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # 其他網址都回 index.html。/index.html 要放在 try_files 最後一個：只有最後一個參數會轉到
  # 上面的 location = /index.html 加上 no-cache；放中間只算檔案檢查、直接回檔案，沒有快取標頭，
  # 瀏覽器可能留著舊首頁去抓部署後已經不存在的舊 JS，畫面一片空白
  location / {
    index index.html index.htm;
    try_files $uri /index.html;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
