<svg viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="white-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#white-glow)" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Magnifying Glass Pupil (Center at 200, 125) -->
    <!-- Outer Lens Ring -->
    <circle cx="200" cy="125" r="44" stroke-width="3.2" />
    <!-- Inner Lens Reflection / Reticle -->
    <circle cx="200" cy="125" r="38" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.75" />
    <!-- Pupil Core -->
    <circle cx="200" cy="125" r="18" fill="#ffffff" fill-opacity="0.15" stroke-width="2.5" />
    <!-- Specular Light Reflection in Lens -->
    <circle cx="192" cy="117" r="4.5" fill="#ffffff" stroke="none" />
    <ellipse cx="212" cy="135" rx="2" ry="3" fill="#ffffff" fill-opacity="0.6" stroke="none" transform="rotate(-30 212 135)" />

    <!-- Magnifying Glass Handle: Extends down-right, ends in Acanthus scroll finial -->
    <path d="M232 156 L268 196" stroke-width="4.5" />
    <!-- Handle grip scroll -->
    <path d="M268 196 C276 205 288 202 291 193 C294 184 285 178 277 181 C272 183 268 189 270 193" stroke-width="2.2" />
    <path d="M256 182 C262 188 266 186 268 182" stroke-width="1.8" />

    <!-- Upper Eyelid: Flowing Acanthus Leaf Fluting -->
    <!-- Main sweeping arch -->
    <path d="M55 135 C95 72 145 46 200 46 C255 46 305 72 345 135" stroke-width="3.5" />
    <!-- Parallel eyelid inner contour line -->
    <path d="M80 130 C115 82 155 62 200 62 C245 62 285 82 320 130" stroke-width="1.8" opacity="0.8" />

    <!-- Acanthus Leaf Fronds - Upper Crown -->
    <!-- Left Frond -->
    <path d="M115 105 C118 82 135 68 152 74 C144 82 140 92 138 98" stroke-width="2.2" />
    <path d="M128 85 C136 78 144 80 148 88" stroke-width="1.5" opacity="0.8" />
    <!-- Center Left Frond -->
    <path d="M160 74 C172 50 192 42 208 50 C198 58 192 68 190 74" stroke-width="2.2" />
    <!-- Center Right Frond -->
    <path d="M210 50 C226 42 246 50 258 74 C248 76 240 86 238 94" stroke-width="2.2" />
    <!-- Right Frond -->
    <path d="M262 78 C278 86 288 98 292 112 C285 108 276 104 268 104" stroke-width="2.2" />

    <!-- Corner Volute Scrolls -->
    <!-- Left Tear Duct Volute (Baroque spiral inward) -->
    <path d="M55 135 C42 142 34 132 38 120 C43 108 58 110 60 122 C61 128 56 132 50 130" stroke-width="2.2" />
    <!-- Right Temple Volute (Baroque spiral outward) -->
    <path d="M345 135 C358 142 368 132 364 118 C359 104 344 106 340 118 C338 124 342 130 348 128" stroke-width="2.2" />

    <!-- Lower Eyelid: Acanthus Leaf Scroll Underside -->
    <!-- Main bottom contour -->
    <path d="M60 142 C100 198 150 216 200 216 C250 216 300 198 340 142" stroke-width="3.2" />
    <!-- Parallel lower eyelid line -->
    <path d="M85 145 C120 190 158 202 200 202 C242 202 280 190 315 145" stroke-width="1.8" opacity="0.8" />

    <!-- Acanthus Leaf Fronds - Lower Arc -->
    <!-- Lower Left Frond -->
    <path d="M112 170 C118 192 134 204 152 198 C144 190 138 180 136 174" stroke-width="2.2" />
    <!-- Lower Center-Left Frond -->
    <path d="M158 200 C170 220 190 226 206 218 C198 210 194 200 192 194" stroke-width="2.2" />
    <!-- Lower Center-Right Frond -->
    <path d="M214 218 C226 224 238 218 246 204 C240 200 234 195 230 188" stroke-width="2.2" />
    <!-- Lower Right Frond (Intertwining with Magnifying Handle) -->
    <path d="M272 174 C284 186 298 182 306 164 C298 168 288 167 282 162" stroke-width="2.2" />
  </g>
</svg>
