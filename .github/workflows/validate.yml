name: PR validate
# 在 PR 上驗證資料管線（相關路徑才跑）、deploy/compose.prod.yml，並實際建置
# backend/frontend image（不推），作為 Renovate auto-merge 的合併閘門。刻意不在
# workflow trigger 加 paths 過濾：branch protection 的 required check 必須在「每個」PR
# 都回報，否則 compose-only / workflow-only 的 PR 會因沒有檢查結果而永遠卡在 auto-merge。
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 不在 workflow trigger 使用 paths：required validate 必須在每個 PR 都回報。
      # 只條件執行資料管線步驟，無關 PR 會跳過步驟但不會留下 Pending check。
      - name: Check data pipeline paths
        id: data-pipeline-paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changed:
              - 'data_pipeline/**'
              - 'deploy/seed/**'
              - '.github/workflows/validate.yml'

      - name: Test data pipeline
        if: steps.data-pipeline-paths.outputs.changed == 'true'
        working-directory: data_pipeline/.agents/skills/scam-knowledge-pipeline
        run: python3 -m unittest discover -s tests

      - name: Check game case leakage and tag balance
        if: steps.data-pipeline-paths.outputs.changed == 'true'
        working-directory: data_pipeline/.agents/skills/scam-knowledge-pipeline
        # 暫時沿用現有題庫最低值 social_proof=2；題庫擴充後應調高到策展目標 6。
        run: >-
          python3 scripts/leak_probe.py
          --from-dump "$GITHUB_WORKSPACE/deploy/seed/game_cases.sql"
          --probe lexical,match
          --tag-balance
          --min-tag-count 2
          --fail-over 0.75

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # compose.prod.yml 用 env_file: .env(fresh checkout 無此檔)——由 .env.example 建一份
      # 佔位 .env 讓 config 可解析;--project-directory . 讓 env_file/volumes 從 repo 根解析。
      - name: Validate deploy/compose.prod.yml
        run: |
          cp .env.example .env
          docker compose -f deploy/compose.prod.yml --project-directory . config > /dev/null && echo "compose.prod config OK"

      # 實際建置（amd64、不推送）——抓得到 base image 等依賴更新造成的 build 破壞。
      # 重用 main 上 build.yml 的 GHA cache 以加速;arm64 仍由合併後的 build.yml 驗證。
      - name: Build backend (amd64, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=backend-linux-amd64
          cache-to: type=gha,mode=max,scope=pr-validate-backend

      - name: Build frontend (amd64, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: VITE_API_URL=https://api.example.com
          cache-from: type=gha,scope=frontend-linux-amd64
          cache-to: type=gha,mode=max,scope=pr-validate-frontend
